services:
  postgres:
    build:
      context: ..
      dockerfile: docker/postgres/Dockerfile
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?define POSTGRES_USER no .env}
      POSTGRES_DB: ${POSTGRES_DB:?defina POSTGRES_DB no .env}
    secrets: [db_password]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL","pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  nextjs:
    build:
      context: ..
      dockerfile: docker/nextjs/Dockerfile
      target: prod
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
      BETTER_AUTH_URL: https://localhost:${HTTPS_PORT:-8443}   # a URL que o navegador usa (nginx)
    secrets: [db_password, better_auth_secret]
    depends_on:
      postgres: { condition: service_healthy }

  # Só com `make studio` (profile tools) e só para esta máquina: abre o banco sem senha
  prisma-studio:
    profiles: [tools]
    build:
      context: ..
      dockerfile: docker/nextjs/Dockerfile
      target: dev
    command: ["sh","-c","socat TCP-LISTEN:5556,fork,reuseaddr TCP:127.0.0.1:5555 & exec npx prisma studio --port 5555 --browser none"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
      BETTER_AUTH_URL: https://localhost:${HTTPS_PORT:-8443}
      APP_MODE: dev
    secrets: [db_password, better_auth_secret]
    ports:
      - "127.0.0.1:5555:5556"
    volumes:
      - ../apps/web:/app
      - /app/node_modules
    depends_on:
      postgres: { condition: service_healthy }

  # Único serviço com porta publicada: HTTPS, e HTTP só para redirecionar
  nginx:
    build:
      context: ..
      dockerfile: docker/nginx/Dockerfile
    environment:
      HTTPS_PORT: ${HTTPS_PORT:-8443}
    ports:
      - "${HTTP_PORT:-8080}:80"
      - "${HTTPS_PORT:-8443}:443"
    volumes:
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - nextjs

secrets:
  db_password:
    file: ./secrets/db_password.txt
  better_auth_secret:
    file: ./secrets/better_auth_secret.txt

volumes:
  postgres_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ../data/postgres
